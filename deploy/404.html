<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">

  <meta name="theme-color" content="#f5f6f7">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.ico" sizes="32x32">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">

  <title>Stránka nenalezena | Scanity</title>

<body>
  <header class="site-header legal-header shell">
    <a href="/" aria-label="Domovská stránka Scanity" class="brand">

    <div class="hero-actions">
      <a class="button button-dark" href="/">Na hlavní stránku</a>
      <a class="button button-ghost" href="/#demo">Zobrazit ukázku</a>
